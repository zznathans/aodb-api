name: Docker

on:
  release:
    types: [published]

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/zznathans/aodb-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two separate scans rather than one gating on `format: sarif`: the sarif+exit-code
      # combination in this trivy-action version was observed to fail the step (nonzero
      # `outcome`) even when the produced SARIF had zero results (verified via the GitHub
      # code-scanning API - genuinely empty) and a local `trivy image` run against the exact
      # same pushed digest, same pinned trivy version, passed clean. Trusting a `continue-on-
      # error` step's ambiguous `outcome` for the actual gate isn't reliable; a plain
      # `format: table` scan's own exit code is unambiguous, so let it fail the job directly.
      - name: Scan image for vulnerabilities (fails the build on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb-api@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate SARIF for the Security tab (informational, non-gating)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/zznathans/aodb-api@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

  notify-aodb-api-helm:
    name: Notify aodb-api-helm
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: zznathans/aodb-api-helm
          token: ${{ secrets.RELEASE_PAT }}

      - name: Bump image repository/tag and open a PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sed -i \
            -e "s|^  imageRepository:.*|  imageRepository: ghcr.io/zznathans/aodb-api|" \
            -e "s|^  imageTag:.*|  imageTag: \"${RELEASE_TAG}\"|" \
            charts/aodb-api/values.yaml

          if git diff --quiet -- charts/aodb-api/values.yaml; then
            echo "Image repository/tag already up to date, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="bump-aodb-api-image-${RELEASE_TAG}"
          git checkout -b "$branch"
          git add charts/aodb-api/values.yaml
          git commit -m "fix(aodb-api): bump image to ${RELEASE_TAG}"
          git push origin "$branch"

          gh pr create \
            --repo zznathans/aodb-api-helm \
            --base main \
            --head "$branch" \
            --title "fix(aodb-api): bump image to ${RELEASE_TAG}" \
            --body "Bumps the aodb-api image to [zznathans/aodb-api ${RELEASE_TAG}](https://github.com/zznathans/aodb-api/releases/tag/${RELEASE_TAG})."
